<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بازی سنگ کاغذ قیچی | Rock Paper Scissors</title>

    <meta name="description" content="بازی سنگ کاغذ قیچی آنلاین؛ با کامپیوتر بازی کنید و امتیاز خود را ثبت کنید.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>Rock Paper Scissors 🎮</h1>

        <button id="rock">سنگ 🪨</button>
        <button id="paper">کاغذ 📄</button>
        <button id="scissors">قیچی ✂️</button>

        <button id="reset">شروع دوباره</button>

        <p id="user-choice">شما: -</p>
        <p id="computer-choice">کامپیوتر: -</p>

        <p id="user-score">امتیاز شما: 0</p>
        <p id="computer-score">امتیاز کامپیوتر: 0</p>

        <p id="result"></p>

        <h2>تاریخچه بازی</h2>

        <ul id="history-list"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
